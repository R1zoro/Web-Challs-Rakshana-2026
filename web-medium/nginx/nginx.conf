worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Rate limiting: 15 req/s per IP
    limit_req_zone $binary_remote_addr zone=med_limit:10m rate=15r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Shield: Block access to source code, package files, configs, dotfiles
        location ~* (\.js\.map|\.env|\.git|\.docker|\.bak|\.sh|\.yml|\.yaml|Dockerfile|package\.json|package-lock\.json|\/\.) {
            return 404;
        }

        location / {
            limit_req zone=med_limit burst=20 nodelay;

            proxy_pass http://web_medium_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }
    }
}
