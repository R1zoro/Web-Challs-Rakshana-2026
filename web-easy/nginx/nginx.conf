worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories writable by non-root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # DoS & Slowloris mitigations
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Rate limiting zones:
    # 1. General browsing: 20 req/s per IP
    limit_req_zone $binary_remote_addr zone=easy_limit:10m rate=20r/s;
    # 2. Strict anti-brute force for auth & gate: 3 req/s
    limit_req_zone $binary_remote_addr zone=easy_auth:10m rate=3r/s;
    # 3. Grievance inspection API: 10 req/s
    limit_req_zone $binary_remote_addr zone=easy_api:10m rate=10r/s;

    limit_req_status 429;

    # Anti-bot & automated tool dropping
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|acunetix|masscan|zgrab) 1;
    }

    server {
        listen 80;
        server_name _;

        # Drop automated security scanners
        if ($bad_bot) {
            return 403;
        }

        # Shield: Block access to source code, configs, hidden files, or dangerous extensions
        location ~* (\.py|\.pyc|\.db|\.env|\.git|\.docker|\.bak|\.sh|\.yml|\.yaml|Dockerfile|requirements\.txt|\/\.) {
            return 404;
        }

        # Anti-Brute Force on Login and Gate submission
        location ~ ^/(login|gate/submit) {
            limit_req zone=easy_auth burst=5 nodelay;

            proxy_pass http://web_easy_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }

        # Grievance & Discrepancy Case Viewer API
        location /api/grievance/view {
            limit_req zone=easy_api burst=10 nodelay;

            proxy_pass http://web_easy_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }

        # All other dynamic requests
        location / {
            limit_req zone=easy_limit burst=25 nodelay;

            proxy_pass http://web_easy_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }
    }
}
