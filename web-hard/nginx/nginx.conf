worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # DoS & Slowloris mitigations
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Rate limiting zones:
    # 1. General browsing: 20 req/s per IP
    limit_req_zone $binary_remote_addr zone=hard_limit:10m rate=20r/s;
    # 2. Strict anti-brute force for gate and voucher claim: 3 req/s
    limit_req_zone $binary_remote_addr zone=hard_gate:10m rate=3r/s;
    # 3. Diagnostic probe dispatcher: 5 req/s
    limit_req_zone $binary_remote_addr zone=hard_probe:10m rate=5r/s;

    limit_req_status 429;

    # Anti-bot & automated tool dropping
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|acunetix|masscan|zgrab) 1;
    }

    upstream scada_backend {
        server web_hard_app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Drop automated security scanners
        if ($bad_bot) {
            return 403;
        }

        # Shield: Block access to source code, databases, configs, dotfiles
        location ~* (\.py|\.pyc|\.db|\.env|\.git|\.docker|\.bak|\.sh|\.yml|\.yaml|Dockerfile|requirements\.txt|\/\.) {
            return 404;
        }

        # Anti-Brute Force on Gate Submission and Clearance Voucher Claim
        location ~ ^/(gate/submit|scada/clearance-claim) {
            limit_req zone=hard_gate burst=5 nodelay;

            proxy_pass http://scada_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }

        # Rate-limiting for Diagnostic Probe Dispatcher
        location /api/v1/scada/diagnostics/probe {
            limit_req zone=hard_probe burst=5 nodelay;

            proxy_pass http://scada_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 20s;
            proxy_connect_timeout 15s;
        }

        # Static asset caching
        location /static/ {
            proxy_pass http://scada_backend/static/;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Main SCADA Workstation Proxy
        location / {
            limit_req zone=hard_limit burst=25 nodelay;

            proxy_pass http://scada_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }
    }
}
