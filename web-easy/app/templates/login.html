{% extends 'base.html' %}
{% block content %}
<div class="container my-5 py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            
            <!-- Security Header Card -->
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-industrial-dark text-white text-center py-4 border-bottom border-warning border-3">
                    <span class="badge bg-gold text-dark mb-2 px-3 py-1 fw-bold">CONTRACTOR AUTHENTICATION</span>
                    <h4 class="fw-bold mb-0">M-AMCEL Requisition Portal</h4>
                    <p class="small text-light opacity-75 mb-0 mt-1">Authorized Supply Chain Personnel Only</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    
                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-shield-x fs-4 me-2"></i>
                        <div class="small">{{ error }}</div>
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Contractor User ID</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="e.g. contractor_testing" required autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Security Passphrase / Token</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Authenticate Session
                        </button>
                    </form>
                </div>

                <div class="card-footer bg-light text-center py-3 border-top small text-muted">
                    <i class="bi bi-shield-lock-fill text-secondary me-1"></i> Secure 256-Bit Encrypted Procurement Session
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
