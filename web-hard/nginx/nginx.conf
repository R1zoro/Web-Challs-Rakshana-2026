events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting for CTF DDoS protection
    limit_req_zone $binary_remote_addr zone=scada_req_limit:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=scada_conn_limit:10m;

    # Basic anti-bot & automated tool dropping
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|acunetix|masscan|zgrab) 1;
    }

    upstream scada_backend {
        server web_hard_app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Block automated scanners
        if ($bad_bot) {
            return 403;
        }

        # C-level drop for automated directory scanners probing irrelevant noise
        location ~* /\.(git|env|svn|htaccess) {
            return 404 '{"error":"Not Found"}';
        }

        # Static asset caching
        location /static/ {
            proxy_pass http://scada_backend/static/;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Main SCADA Workstation Proxy
        location / {
            limit_req zone=scada_req_limit burst=30 nodelay;
            limit_conn scada_conn_limit 25;

            proxy_pass http://scada_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeout for diagnostic probe runs
            proxy_connect_timeout 15s;
            proxy_read_timeout 25s;
            proxy_send_timeout 25s;
        }
    }
}
