worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories writable by non-root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Rate limiting zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Shield: Block access to source code, configs, hidden files, or dangerous extensions
        location ~* (\.py|\.pyc|\.env|\.git|\.docker|\.bak|\.sh|\.yml|\.yaml|Dockerfile|requirements\.txt|\/\.) {
            return 404;
        }

        # IDOR API endpoint with C-level instant drop for any id > 12 or non 1-12
        location /api/grievance/view {
            default_type application/json;
            limit_req zone=api_limit burst=15 nodelay;

            # Regex allows only exact values 1, 2, ..., 9, 10, 11, 12
            if ($arg_id !~ "^([1-9]|1[0-2])$") {
                return 404 '{"status":"error","message":"Ticket record not found or archived."}';
            }

            proxy_pass http://web_easy_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other dynamic requests
        location / {
            proxy_pass http://web_easy_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
            proxy_connect_timeout 15s;
        }
    }
}
